      <text x="786" y="183" fill="#55606e" font-size="12">BLDCアクチュエータ＋CAN</text>

      <line x1="657" y1="250" x2="780" y2="258" stroke="#8a96a3"/><circle cx="657" cy="250" r="2.5" fill="#8a96a3"/>
      <text x="786" y="256">オレンジの胸・腹カバー</text>
      <text x="786" y="273" fill="#55606e" font-size="12">PETG / ASA 外装</text>

      <line x1="637" y1="500" x2="780" y2="480" stroke="#8a96a3"/><circle cx="637" cy="500" r="2.5" fill="#8a96a3"/>
