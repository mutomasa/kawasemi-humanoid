      <text x="786" y="89" fill="#55606e" font-size="12">RGB-Dカメラ内蔵を想定</text>

      <line x1="639" y1="192" x2="780" y2="170" stroke="#8a96a3"/><circle cx="639" cy="192" r="2.5" fill="#8a96a3"/>
