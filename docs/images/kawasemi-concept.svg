      <text x="786" y="493" fill="#55606e" font-size="12">カワセミの足の色</text>

      <line x1="602" y1="225" x2="520" y2="230" stroke="#8a96a3"/><circle cx="602" cy="225" r="2.5" fill="#8a96a3"/>
      <text x="514" y="226" text-anchor="end">背中のターコイズライン</text>
      <text x="514" y="243" text-anchor="end" fill="#55606e" font-size="12">翼のような背面パネル</text>

      <line x1="568" y1="310" x2="520" y2="330" stroke="#8a96a3"/><circle cx="568" cy="310" r="2.5" fill="#8a96a3"/>
      <text x="514" y="327" text-anchor="end">尾羽型バッテリーパック</text>
      <text x="514" y="344" text-anchor="end" fill="#55606e" font-size="12">重心調整を兼ねる</text>
